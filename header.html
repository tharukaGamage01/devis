<script>
    // Mobile nav toggle
    document.addEventListener('DOMContentLoaded', function () {
        var navToggle = document.querySelector('.cs_nav_toggle');
        var navList = document.querySelector('.cs_nav_list');
        function checkMobile() {
            if (window.innerWidth <= 768) {
                navToggle.style.display = 'inline-block';
                navList.style.display = 'none';
                navToggle.style.position = 'absolute';
                navToggle.style.top = '18px';
                navToggle.style.right = '18px';
            } else {
                navToggle.style.display = 'none';
                navList.style.display = 'flex';
                navToggle.style.position = '';
                navToggle.style.top = '';
                navToggle.style.right = '';
            }
        }
        checkMobile();
        window.addEventListener('resize', checkMobile);
        navToggle.addEventListener('click', function () {
            if (navList.style.display === 'none') {
                navList.style.display = 'block';
            } else {
                navList.style.display = 'none';
            }
        });
    });
</script>
<style>
    @media (max-width: 768px) {
        .cs_nav_list {

    }
